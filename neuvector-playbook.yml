site:
  title: SUSE® Security Documentation
  url: /
  start_page: 5.6@security:en:overview.adoc

content:
  sources:
    - url: https://github.com/rancher/neuvector-product-docs.git
      branches: [main]
      start_paths: [docs/*]

ui:
  bundle:
    url: ./dsc-style-bundle/default-ui/ui-bundle.zip
  supplemental_files: ./dsc-style-bundle/supplemental-files/rancher

asciidoc:
  attributes:
    page-pagination: ''
  extensions:
    - '@asciidoctor/tabs'
antora:
  extensions:
  - require: '@antora/lunr-extension'
  - require: '@springio/antora-xref-extension'
  - require: ./product-docs-common/extensions/dynamic-loading-attributes/load-global-site-attributes.js
    attributefile: ./product-docs-common/global-attributes.yml
    enabled: true
  - require: ./product-docs-common/extensions/versions-latest-prerelease/vlp.js
    enabled: true

output:
  dir: build/site
